name: Test Suite

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn ci-lint
      - run: yarn ci-test
